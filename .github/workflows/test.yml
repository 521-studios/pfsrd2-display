name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci runs the prepare script, which builds dist/ — a build failure
      # fails the install step loudly, and the tests hard-require dist/.
      - run: npm ci
      - run: npm test
